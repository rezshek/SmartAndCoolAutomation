name: Backend CI

on:
  push:
    branches: [main, "rezshek/sal-*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7
        env:
          POSTGRES_USER: smartandcool
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: smartandcool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartandcool -d smartandcool_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://smartandcool:ci-only@127.0.0.1:5432/smartandcool_test
      TEST_DATABASE_URL: postgresql+psycopg://smartandcool:ci-only@127.0.0.1:5432/smartandcool_test
      LIVE_CHECKS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked alembic check
      - run: uv run --locked pytest
      - run: uv build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

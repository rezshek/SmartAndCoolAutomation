services:
  db:
    image: postgres:17.7
    environment:
      POSTGRES_USER: smartandcool
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: smartandcool
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartandcool -d smartandcool"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
